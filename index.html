function calcDue(subtotal,shipping,policy,cfg){const total=subtotal+shipping;if(policy==='blocked')return 0;if(policy==='full')return total;if(policy==='exempt')return 0;const basis=subtotal+(cfg.includeShipping?shipping:0);return basis>cfg.threshold?Math.ceil(basis*cfg.rate/100):0;}
function orderTotals(o){const subtotal=o.items.reduce((a,i)=>a+(i.allocated===null?i.qty:i.allocated)*i.price,0);const shipping=o.delivery.method==='shipping'&&subtotal>0?o.rules.shipping:0;const total=o.status==='cancelled'?0:subtotal+shipping;const approved=o.payments.filter(p=>p.status==='approved').reduce((a,p)=>a+p.amount,0);const refunded=o.refunds.reduce((a,p)=>a+p.amount,0);const paid=approved-refunded;const required=o.status==='cancelled'?0:calcDue(subtotal,shipping,o.policy,o.rules);return {subtotal,shipping,total,approved,refunded,paid,required,balance:Math.max(0,total-paid),initialOutstanding:Math.max(0,required-paid),overpaid:Math.max(0,paid-total)};}

function renderAdminOrders(){const active=state.orders.filter(o=>o.status!=='cancelled'),pending=state.orders.filter(o=>o.payments.some(p=>p.status==='pending')).length,ready=state.orders.filter(o=>o.delivery.status==='ready'&&o.status!=='cancelled').length;let orders=state.orders.filter(o=>{if(ui.filter==='pending'&&!o.payments.some(p=>p.status==='pending'))return false;if(ui.filter==='unpaid'&&!(orderTotals(o).initialOutstanding>0&&o.status!=='cancelled'))return false;if(ui.filter==='ready'&&!(o.delivery.status==='ready'&&o.status!=='cancelled'))return false;if(ui.filter==='refund'&&!o.refundReview)return false;if(ui.filter==='completed'&&o.status!=='completed')return false;if(ui.filter==='cancelled'&&o.status!=='cancelled')return false;const term=ui.search.trim().toLowerCase();return !term||[o.id,o.contact.nickname,o.contact.email,o.contact.phone].join(' ').toLowerCase().includes(term);}).sort((a,b)=>b.sequence-a.sequence);

function renderAdminDetail(o){const t=orderTotals(o),pending=o.payments.filter(p=>p.status==='pending'),isLocked=['shipped','picked'].includes(o.delivery.status)||o.status==='cancelled';return `<div class="detail-header" id="selectedOrderDetail"><div class="row between wrap"><div><div class="eyebrow">ORDER DETAIL · 順位 #${o.sequence}</div><h3 class="mono">${o.id}</h3></div><div class="row gap-6">${badge(...orderLabel(o))}${o.status==='received'?btn('確認訂單','confirm-order',`data-id="${o.id}"`,'sm soft'):''}</div></div>${titleStatusCells(o)}</div><div class="detail-block"><div class="block-head"><span>訂購內容</span><span class="tiny muted">下單價格與規則已留存</span></div><div class="block-body">${summaryItems(o.items,true)}<div class="summary-line"><span class="muted">原訂總額</span><span class="mono">${money(o.originalTotal)}</span></div><div class="summary-line"><span class="muted">運費</span><span class="mono">${money(t.shipping)}</span></div><div class="summary-line big"><span>目前應付總額</span><span class="mono">${money(t.total)}</span></div>${t.total!==o.originalTotal?'<p class="hint">原訂數量與單價保留；上方品項列出目前配貨量。取消訂單應付為零。</p>':''}</div></div><div class="detail-block"><div class="block-head"><span>付款與對帳</span>${badge(policies[o.policy],o.policy==='exempt'?'purple':'')}</div><div class="block-body"><div class="finance-grid"><div><small>${o.policy==='full'?'應先付全額':'目前應付訂金'}</small><b class="mono">${money(t.required)}</b></div><div><small>已確認淨收款</small><b class="mono">${money(t.paid)}</b></div><div><small>尚欠尾款／未付款</small><b class="mono accent">${money(t.balance)}</b></div></div>${o.paymentDueAt?`<p class="hint" style="margin-top:9px">付款期限：${stamp(o.paymentDueAt)}。${new Date(o.paymentDueAt)<new Date()&&t.initialOutstanding>0?'已超時，須人工處理；沒有自動取消順位。':''}</p>`:''}${pending.map(p=>`<div class="payment-box"><div class="row between"><h4>會員已回報匯款</h4>${badge('待人工查帳','amber')}</div><div class="row between"><span class="amount mono">${money(p.amount)}</span><span class="small">末五碼 <strong class="mono">${esc(p.last5||'未提供')}</strong></span></div><div class="proof">匯款時間 ${stamp(p.paidAt)}${p.proofName?` · ${esc(p.proofName)} ${btn('查看截圖','proof',`data-id="${o.id}" data-payment="${p.id}"`,'sm')}`:' · 無上傳截圖'}${p.note?'<br>備註：'+esc(p.note):''}</div><div class="action-grid">${btn('核對相符，確認入帳','approve-payment',`data-id="${o.id}" data-payment="${p.id}"`,'primary sm')}${btn('退回補件','reject-payment',`data-id="${o.id}" data-payment="${p.id}"`,'sm')}</div></div>`).join('')}${o.payments.filter(p=>p.status!=='pending').map(p=>`<div class="summary-line small"><span>${p.method==='cash'?'門市收款':'轉帳'} ${money(p.amount)}</span>${badge(p.status==='approved'?'已核對':'已退回',p.status==='approved'?'green':'red')}</div>`).join('')}<div class="spacer-12"></div><div class="action-grid">${!isLocked&&t.balance>0?btn('登錄門市收款','cash-payment',`data-id="${o.id}"`,'sm'):''}${t.paid>0&&!['shipped','picked'].includes(o.delivery.status)?btn('登錄退款','refund',`data-id="${o.id}"`,'sm danger'):''}${btn('付款期限','payment-deadline',`data-id="${o.id}" ${o.status==='cancelled'?'disabled':''}`,'sm ghost')}</div>${o.refundReview||t.overpaid>0?`<div class="hint-box red" style="margin-top:12px">砍單／取消款項須人工確認。淨收款 ${money(t.paid)}，超出目前應付 ${money(t.overpaid)}。<br>不會自動轉帳、沒收訂金或更改預購資格。${t.overpaid===0?`<br>${btn('記錄款項處理方案','resolve-refund',`data-id="${o.id}"`,'sm')}`:''}</div>`:''}${o.refunds.length?`<p class="hint" style="margin-top:10px">已登錄退款合計 ${money(t.refunded)}。退款僅為記錄，非實際金流執行。</p>`:''}</div></div><div class="detail-block"><div class="block-head"><span>聯絡與交付</span><span class="tiny muted">訂單快照，非即時會員資料</span></div><div class="block-body">${contactPairs(o)}${o.delivery.deadline?`<div class="hint-box purple">保留至 ${stamp(o.delivery.deadline)}${new Date(o.delivery.deadline)<new Date()?'（已逾期，待人工處理）':''}</div><div class="spacer-12"></div>`:''}${o.delivery.tracking?`<p class="hint">寄件單號：${esc(o.delivery.tracking)}</p><div class="spacer-12"></div>`:''}<div class="action-grid">${!isLocked&&o.delivery.status!=='ready'?btn(o.delivery.method==='pickup'?'標記到貨可取':'標記到貨待出貨','ready-order',`data-id="${o.id}"`,'sm soft'):''}${!isLocked&&o.delivery.status==='ready'?btn(o.delivery.method==='pickup'?'完成門市取貨':'登錄寄件單號','finish-order',`data-id="${o.id}"`,'sm primary'):''}${o.delivery.deadline&&!isLocked?btn('展延保留期限','extend-order',`data-id="${o.id}"`,'sm'):''}${!isLocked?btn('編輯聯絡／配送','edit-contact',`data-id="${o.id}"`,'sm'):''}${!isLocked?btn('取消訂單','cancel-order',`data-id="${o.id}"`,'sm danger'):''}</div>${o.requests.map(r=>`<div class="request-box"><div class="row between"><b>會員申請：${esc(r.kind)}</b>${badge(r.status==='pending'?'待處理':'已回覆',r.status==='pending'?'amber':'green')}</div><p>${esc(r.text)}</p>${r.reply?`<p>店家：${esc(r.reply)}</p>`:btn('回覆申請','reply-request',`data-id="${o.id}" data-request="${r.id}"`,'sm')}</div>`).join('')}</div></div><div class="detail-block"><div class="block-head"><span>通知紀錄</span>${badge('僅預覽・未寄信','amber')}</div><div class="block-body">${o.mails.slice().reverse().slice(0,5).map(m=>`<div class="notification-row row between"><div>${esc(m.subject)}<small>${stamp(m.at)} · ${esc(m.to)}</small></div>${btn('預覽','mail-preview',`data-id="${o.id}" data-mail="${m.id}"`,'sm')}</div>`).join('')}</div></div><div class="detail-block"><div class="block-head"><span>操作紀錄與內部備註</span>${btn('內部備註','internal-note',`data-id="${o.id}"`,'sm')}</div><div class="block-body">${o.internalNote?`<div class="hint-box">內部備註：${esc(o.internalNote)}</div><div class="spacer-12"></div>`:''}${timeline(o)}</div></div>`;}
function renderAllocation(){const active=state.orders.filter(o=>o.status!=='cancelled');return `<div class="section admin-content"><div class="section-heading"><div><h3>到貨數量與配貨</h3><p>逐品項依原始下單時間分配，保留砍單紀錄。</p></div></div><div class="hint-box purple">先輸入「本活動累計可供貨量」，再預覽配貨。已通知可取貨、已寄出及已取貨的數量會先保留，不會重新挪用。</div><div class="spacer-16"></div><form id="supplyForm"><div class="table-wrap"><table class="table"><thead><tr><th>品項</th><th class="number">原訂需求</th><th class="number">已保留</th><th class="number">累計可供貨</th></tr></thead><tbody>${state.products.map(p=>{const demand=active.reduce((a,o)=>a+(o.items.find(i=>i.productId===p.id)?.qty||0),0),locked=active.filter(o=>['ready','shipped','picked'].includes(o.delivery.status)).reduce((a,o)=>a+(o.items.find(i=>i.productId===p.id)?.allocated||0),0);return `<tr><td><b>${esc(p.code)}</b><span class="sub">${esc(p.name)}</span></td><td class="number">${demand}</td><td class="number">${locked}</td><td class="number"><input name="${p.id}" data-supply="${p.id}" type="number" min="0" max="99999" step="1" value="${state.supply[p.id]||0}" aria-label="${esc(p.name)}累計可供貨量"></td></tr>`;}).join('')}</tbody></table></div><div class="spacer-16"></div>${btn('預覽依序配貨結果','preview-allocation','','primary full')}</form><div class="spacer-16"></div><div class="hint-box amber">第一版的示範規則：未付款訂單不會被自動跳過。逾期後由店家人工取消，才會釋出順位與數量；此規則仍待你確認。<br>「配到貨」不等於「通知可取貨」，要在訂單內另行通知。</div><div class="spacer-20"></div><h3>目前配貨狀況</h3><div class="spacer-12"></div>${active.sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)||a.sequence-b.sequence).map(o=>`<div class="order-card"><div class="row between wrap"><div><b class="small">#${o.sequence} · ${esc(o.contact.nickname)}</b><div class="tiny muted mono">${o.id}</div></div>${badge(...deliveryLabel(o))}</div><div class="spacer-8"></div>${o.items.map(i=>`<div class="summary-line"><span>${esc(i.code)}</span><span class="mono">原訂 ${i.qty} ／ ${i.allocated===null?'尚未配貨':'配貨 '+i.allocated}</span></div>`).join('')}${btn('開啟訂單','select-order',`data-id="${o.id}"`,'sm ghost')}</div>`).join('')}</div>`;}
function renderSettings(){const c=state.config;return `<div class="section admin-content"><div class="section-heading"><div><h3>活動與會員設定</h3><p>修改活動設定只影響新訂單；舊單保存原規則。</p></div></div><div class="hint-box amber">下列計算基準與期限是原型暫定值，不代表已與店家確認。會員免訂金資格只能由管理端設定。</div><div class="spacer-16"></div><form id="settingsForm"><div class="settings-section"><h3>活動資訊</h3><div class="form-grid"><label class="field full"><span>活動名稱</span><input name="title" maxlength="100" value="${esc(c.title)}" required></label><label class="field"><span>收單截止日</span><input type="date" name="closeDate" value="${c.closeDate}" required></label><label class="field"><span>預計上市日</span><input type="date" name="releaseDate" value="${c.releaseDate}" required></label><label class="field"><span>活動狀態</span><select name="status">${[['open','開放收單'],['closed','停止收單'],['draft','草稿']].map(([v,l])=>opt(v,l,c.status)).join('')}</select></label><label class="field"><span>運費（每單）</span><input type="number" name="shipping" min="0" max="9999" step="1" value="${c.shipping}" required></label></div><div class="spacer-12"></div><label class="check"><input type="checkbox" name="demoOverride" ${c.demoOverride?'checked':''}><span>允許歷史活動測試下單<small>開啟只略過截止日，不會略過「停止收單」或會員資格。正式環境不得保留此開關。</small></span></label></div><div class="settings-section"><h3>訂金與保留期限 <span class="badge amber">待確認規則</span></h3><div class="form-grid"><label class="field"><span>嚴格超過此金額才收訂金</span><input type="number" name="threshold" min="0" max="999999" step="1" value="${c.threshold}" required></label><label class="field"><span>訂金比例（%）</span><input type="number" name="rate" min="1" max="100" step="1" value="${c.rate}" required></label><label class="field"><span>金額計算基準</span><select name="includeShipping">${opt('true','含運總額',c.includeShipping)}${opt('false','商品小計，不含運費',c.includeShipping)}</select></label><label class="field"><span>訂金付款期限（下單後幾天）</span><input type="number" name="depositDays" min="1" max="30" step="1" value="${c.depositDays}" required></label><label class="field"><span>到貨保留天數（通知後起算）</span><input type="number" name="holdDays" min="1" max="60" step="1" value="${c.holdDays}" required></label><label class="field"><span>同會員多張訂單</span><input readonly value="本原型按單計算，不合併"></label></div><p class="help">訂金無條件進位至新臺幣整數元。按單計算、運費納入與付款 3 天均需再確認；取貨 7 天沿用舊規則，起算點暫定為通知時間。</p></div><div class="settings-section"><h3>收款資訊（僅輸入示範資料）</h3><div class="form-grid"><label class="field"><span>銀行名稱</span><input name="bankName" value="${esc(c.bankName)}" maxlength="50" placeholder="尚未設定"></label><label class="field"><span>銀行代碼</span><input name="bankCode" value="${esc(c.bankCode)}" maxlength="10" placeholder="尚未設定"></label><label class="field full"><span>收款帳號</span><input name="bankAccount" value="${esc(c.bankAccount)}" maxlength="30" placeholder="本原型沒有真實收款帳號"></label><label class="field full"><span>付款說明</span><input name="bankNote" value="${esc(c.bankNote)}" maxlength="200"></label></div></div><div class="settings-section"><h3>品項價格 <span class="badge">舊單單價不變</span></h3>${state.products.map(p=>`<div class="settings-inline-product"><div><b>${esc(p.name)}</b><small>${esc(p.code)}／每${esc(p.unit)}，NT$</small></div><input type="number" name="price-${p.id}" min="1" max="999999" step="1" value="${p.price}" aria-label="${esc(p.name)}單價" required></div>`).join('')}</div><button type="submit" class="btn primary full">儲存活動設定</button></form><div class="spacer-20"></div><div class="settings-section"><h3>會員預購資格</h3><div class="hint" style="margin-bottom:10px">修改只影響新訂單。免訂金與全額預付不能由用戶端自行勾選。</div>${state.members.map(m=>`<div class="notification-row"><div class="row between wrap"><div><b>${esc(m.name)}</b><small>${esc(m.id)}${m.id===CURRENT_MEMBER?' · 左側目前登入會員':''}</small></div><div class="row gap-6">${badge(policies[m.policy],m.policy==='blocked'?'red':'purple')}${btn('調整資格','member-policy',`data-member="${m.id}"`,'sm')}</div></div></div>`).join('')}</div><div class="settings-section"><h3>示範資料與本機備份</h3><p class="hint">資料保存在這個瀏覽器。兩側切換不是正式登入或權限隔離。請勿填入真實個資或匯款截圖。</p><div class="spacer-12"></div><div class="action-grid">${btn('匯出示範 JSON','export-json','','sm')}${btn('重設示範資料','reset-demo','','sm danger')}</div></div><div class="source-note">依原 Google 表單與本次討論製作。原型未連接會員資料庫、寄包餘額、優惠券、LINE、Email、金流或物流服務。此活動不會更動既有寄包系統。</div></div>`;}
function renderAll(){renderCustomer();renderAdmin();setView(ui.view);renderStorage();}
function commit(o,text,subject,isPublic=true,actor='示範管理員'){addEvent(o,text,isPublic,actor);if(subject)addMail(o,subject+'｜'+o.id);persist();renderAll();toast('示範資料已更新，兩側已同步。'+(subject?' 通知僅產生預覽，未寄出。':''));}
function scrollCustomerTop(){$('#customerContent').scrollTop=0;if(innerWidth<980)$('#customerPane').scrollIntoView({behavior:'smooth',block:'start'});}
function showForm(title,body,kind,orderId='',extra='',submitLabel='確認儲存'){openModal(title,`<form id="modalForm" data-kind="${kind}" data-order="${esc(orderId)}" ${extra}>${body}<div class="form-error" id="modalError" hidden role="alert"></div><div class="dialog-footer">${btn('取消','close-modal','','ghost')}<button class="btn primary" type="submit">${submitLabel}</button></div></form>`);}
function modalError(text){const el=$('#modalError');if(el){el.hidden=false;el.textContent=text;el.scrollIntoView({block:'nearest'});}else toast(text,'error');}
function inputField(label,name,value='',type='text',extra=''){return `<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function textField(label,name,value='',required=true){return `<label class="field"><span>${label}</span><textarea name="${name}" maxlength="800" rows="3" ${required?'required':''}>${esc(value)}</textarea></label>`;}
function terms(){const c=state.config;openModal('預購規則與原型暫定設定',`<div class="hint-box amber">這是歷史活動的互動示範，不會成立真實訂購契約。原文中「禁止預購」與「全額預付才可預購」的差異仍待店家確認。</div><div class="spacer-16"></div><h3>沿用舊表單的營運說明</h3><div class="description" style="margin-top:10px">若遭遇砍單，依「下單順序」分配；涉及已付訂金，由店家確認退款。\n原表單：訂購超過 10,000 元收取 10% 訂金，連續預購玩家免付訂金。\n預購商品保留 7 天，無法如期取貨請事先告知。\n原文亦載明：未取貨／棄單可能不退訂金、列入黑名單，往後須全額預付。原型不自動執行沒收或封鎖。\n原活動提供店到店服務，每單運費 60 元。\n可於門市繳費，或先向官方 LINE／粉專取得帳號後轉帳，再回報末五碼或匯款截圖。\n到貨延遲或砍單，以店家後續通知為準。</div><div class="spacer-20"></div><h3>這份原型的可調整設定</h3><div class="description small" style="margin-top:8px">${esc(ruleSummary())}\n付款期限：下單後 ${c.depositDays} 天。\n商品保留：到貨通知產生後 ${c.holdDays} 天。\n同會員同活動：先按單計算，不自動合併。\n免訂金／全額預付／禁止預購：由管理員指定。\n逾期未付款或未取貨：只標示逾期，由管理員處理，不自動取消。\n砍單後重新試算應付，但退款仍需人工決定與登錄。</div><div class="source-note"><a href="${SOURCE_FORM}" target="_blank" rel="noopener noreferrer">查看原 Google 表單 ↗</a><br>正式上線前需確認最終營運規則與對外條款，再保存版本供客人勾選。</div><div class="dialog-footer">${btn('關閉','close-modal','','primary')}</div>`);}
function help(){openModal('如何測試這份預購原型',`<div class="help-list"><div class="help-step"><span>1</span><div><b>測試下單</b><p>左側「試填萬元訂單」會帶入 6 盒 M6a。選擇店到店、填入虛構資料，再確認送出。</p></div></div><div class="help-step"><span>2</span><div><b>測試補匯款</b><p>在「我的訂單」填寫金額、時間、末五碼或示範截圖，右側即出現待核款。</p></div></div><div class="help-step"><span>3</span><div><b>測試店家作業</b><p>先確認訂單及款項，再到「到貨與配貨」輸入可供貨量、預覽後套用。回到訂單通知取貨或登錄寄件。</p></div></div><div class="help-step"><span>4</span><div><b>測試砍單與免訂金</b><p>降低可供貨量即可預覽砍單。到「活動與會員」調整資格後，新的訂單會依新資格計算，舊單不變。</p></div></div></div><div class="spacer-20"></div><div class="hint-box amber">沒有連線到正式會員系統、銀行、LINE、Email 或物流。所有通知都是預覽；畫面中的會員與訂單是虛構資料。請勿輸入真實個資。</div><div class="spacer-12"></div><p class="hint">單檔 HTML，不需要安裝。商品圖片沿用 Google 表單遠端連結，需網路；圖片載入失敗時以品項代碼替代。手機可用上方切換用戶端／管理端。</p><div class="dialog-footer">${btn('開始測試','close-modal','','primary')}</div>`);}
function reportPayment(orderId){const o=getOrder(orderId);if(!o||o.memberId!==CURRENT_MEMBER)return toast('找不到此會員的訂單。','error');const t=orderTotals(o);if(o.status==='cancelled'||o.status==='completed'||t.balance<=0)return toast('此訂單目前不能補填付款。','error');if(o.payments.some(p=>p.status==='pending'))return toast('已有一筆付款等待核對，請勿重複回報。','error');ui.paymentProof=null;const local=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).replace(' ','T');showForm('補填匯款資料',`<div class="hint-box purple">${esc(o.id)}<br>本次尚需先付 ${money(t.initialOutstanding)}，全部未付款 ${money(t.balance)}。${bankInfo()}</div><div class="spacer-16"></div><div class="form-grid">${inputField('本次匯款金額（NT$）','amount',t.initialOutstanding||t.balance,'number',`min="1" max="${t.balance}" step="1" required`)}${inputField('匯款日期與時間（臺灣時間）','paidAt',local,'datetime-local','required')}${inputField('匯款帳號末五碼','last5','','text','inputmode="numeric" maxlength="5" pattern="[0-9]{5}" placeholder="12345"')}<label class="field"><span>匯款截圖（可代替末五碼）</span><input id="proofFile" type="file" accept="image/png,image/jpeg,image/webp"><small>僅限 PNG／JPG／WebP，最大 1.5 MB，存在此瀏覽器；請使用虛構資料。</small></label></div><div id="proofStatus" class="hint" style="margin-top:8px"></div><div class="spacer-16"></div>${textField('付款備註（選填）','note','',false)}<div class="spacer-12"></div><div class="hint-box amber">金額必須由店家實際查帳確認。回報成功不等於付款成功。</div>`,'report-payment',o.id,'','送出匯款回報');}
function buildMailHtml(m){return `<div class="mail-warning">Email 預覽・沒有真正寄出。下列資訊固定於 ${stamp(m.at)}，不會隨後續狀態改寫。</div><div class="mail-paper"><div class="mail-brand">卡之洞 <span class="small muted">CARDSCAVE</span></div><div class="mail-body"><h3>${esc(m.subject)}</h3><p>${esc(m.contact.nickname)}，以下是你的預購資訊。</p><div class="status-grid"><div class="status-cell"><small>訂單</small>${esc(m.orderState)}</div><div class="status-cell"><small>付款</small>${esc(m.paymentState)}</div><div class="status-cell"><small>交付</small>${esc(m.deliveryState)}</div></div><p class="mono">訂單編號：${esc(m.orderId)}</p>${summaryItems(m.items,true)}<div class="spacer-8"></div><div class="summary-line"><span>原訂總額</span><span>${money(m.originalTotal)}</span></div><div class="summary-line"><span>目前商品小計／運費</span><span>${money(m.totals.subtotal)}／${money(m.totals.shipping)}</span></div><div class="summary-line big"><span>目前應付總額</span><span>${money(m.totals.total)}</span></div><div class="summary-line"><span>應付訂金／預付款</span><span>${money(m.totals.required)}</span></div><div class="summary-line"><span>已確認淨收款／未付款</span><span>${money(m.totals.paid)}／${money(m.totals.balance)}</span></div><div class="summary-line"><span>已登錄退款</span><span>${money(m.totals.refunded)}</span></div><hr class="split-rule"><dl class="data-pairs"><dt>電子郵件</dt><dd>${esc(m.contact.email)}</dd><dt>LINE 暱稱</dt><dd>${esc(m.contact.nickname)}</dd><dt>聯絡手機</dt><dd>${esc(m.contact.phone)}</dd><dt>取貨方式</dt><dd>${m.delivery.method==='pickup'?'門市自取':esc(m.delivery.carrier)}</dd>${m.delivery.method==='shipping'?`<dt>收件人</dt><dd>${esc(m.delivery.receiver)}</dd><dt>收件手機</dt><dd>${esc(m.delivery.phone)}</dd><dt>門市</dt><dd>${esc(m.delivery.county)} ${esc(m.delivery.storeName)} ${esc(m.delivery.storeCode)}</dd>`:''}${m.paymentDueAt?`<dt>付款期限</dt><dd>${stamp(m.paymentDueAt)}</dd>`:''}${m.delivery.deadline?`<dt>保留期限</dt><dd>${stamp(m.delivery.deadline)}</dd>`:''}${m.delivery.tracking?`<dt>寄件單號</dt><dd>${esc(m.delivery.tracking)}</dd>`:''}<dt>訂單備註</dt><dd>${esc(m.note)||'無'}</dd></dl>${m.payments.length?`<hr class="split-rule"><h4>付款回報紀錄</h4>${m.payments.map(p=>`<p class="small">${p.method==='cash'?'門市':'轉帳'} ${money(p.amount)} · ${esc(({approved:'已核對',pending:'待核對',rejected:'已退回'})[p.status])}${p.last5?' · 末五碼 '+esc(p.last5):''}<br>${stamp(p.paidAt)}${p.note?'<br>'+esc(p.note):''}</p>`).join('')}`:''}<div class="hint-box">收件、付款與配貨是不同處理階段；本通知不代表保證供貨。規則版本：${esc(m.ruleVersion)}。</div></div><div class="mail-meta">收件人 ${esc(m.to)}<br>預覽建立時間 ${stamp(m.at)} · 本原型沒有郵件發送服務</div></div><div class="dialog-footer">${btn('匯出文字版','export-mail',`data-id="${m.orderId}" data-mail="${m.id}"`,'')}${btn('關閉','close-modal','','primary')}</div>`;}
function previewMail(orderId,mailId){const o=getOrder(orderId);if(!o)return;const m=mailId?o.mails.find(x=>x.id===mailId):o.mails.at(-1);if(!m)return toast('尚無確認信預覽。','error');openModal('訂單通知預覽',buildMailHtml(m));}
function lockedOrder(o){return o.status==='cancelled'||['shipped','picked'].includes(o.delivery.status);}
function readinessError(o){if(o.status!=='confirmed')return '請先確認訂單。';if(o.items.some(i=>i.allocated===null))return '請先到「到貨與配貨」完成配貨。';if(o.items.reduce((a,i)=>a+(i.allocated||0),0)===0)return '這張訂單目前沒有配到商品，不能通知取貨。';if(orderTotals(o).initialOutstanding>0)return '應付訂金／預付款尚未繳足，請先核對款項。';if(o.refundReview)return '請先處理砍單後的款項方案，再通知交付。';return '';}
function computeAllocation(supply){const result=[],active=state.orders.filter(o=>o.status!=='cancelled'),locked=active.filter(o=>['ready','shipped','picked'].includes(o.delivery.status)),free={...supply};for(const o of locked)for(const i of o.items)free[i.productId]-=(i.allocated??i.qty);for(const [k,n] of Object.entries(free))if(n<0)throw Error(`${k} 的可供貨量不能低於已通知／已交付保留量。`);const pending=active.filter(o=>!locked.includes(o)).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)||a.sequence-b.sequence);for(const o of pending){const items=o.items.map(i=>{const allocated=Math.min(i.qty,Math.max(0,free[i.productId]||0));free[i.productId]-=allocated;return {...i,allocated};});result.push({orderId:o.id,items});}return {result,supply,remaining:free,lockedCount:locked.length};}
function previewAllocation(){const f=$('#supplyForm'),supply={};for(const p of state.products){const v=f.elements.namedItem(p.id).value;if(!finiteInt(v,0,99999))return toast('供貨數量必須是 0–99,999 的整數。','error');supply[p.id]=Number(v);}let plan;try{plan=computeAllocation(supply);}catch(e){return toast(e.message,'error');}ui.allocationPreview=plan;openModal('配貨結果預覽',`<div class="hint-box purple">按最早下單時間分配；${plan.lockedCount} 張已通知／已交付訂單保持不變。只有按下確認後才會更新。</div><div class="spacer-16"></div>${plan.result.map(r=>{const o=getOrder(r.orderId),cut=r.items.some(i=>i.allocated<i.qty);return `<div class="order-card"><div class="row between wrap"><b class="small">#${o.sequence} ${esc(o.contact.nickname)}</b>${badge(cut?'存在砍單':'全數配貨',cut?'red':'green')}</div><div class="tiny muted mono">${o.id}</div>${r.items.map(i=>`<div class="summary-line"><span>${esc(i.code)}</span><span>${i.qty} → <b>${i.allocated}</b></span></div>`).join('')}</div>`;}).join('')||'<div class="empty">沒有待配貨的有效訂單。</div>'}<div class="hint-box amber">套用後保留原訂數量、更新應付金額並產生通知預覽。砍單不會自動退款或取消整單；需要店家確認處理。</div><div class="dialog-footer">${btn('取消','close-modal','','ghost')}${btn('確認套用配貨','apply-allocation','','primary')}</div>`);}
function applyAllocation(){const plan=ui.allocationPreview;if(!plan)return;state.supply={...plan.supply};for(const r of plan.result){const o=getOrder(r.orderId);const changed=o.items.some((i,k)=>i.allocated!==r.items[k].allocated);if(!changed)continue;const cut=r.items.some(i=>i.allocated<i.qty);o.items=r.items;o.allocationAt=now();if(cut&&orderTotals(o).paid>0)o.refundReview=true;addEvent(o,'依原始下單排序配貨：'+o.items.map(i=>i.code+' 原訂 '+i.qty+'／配貨 '+i.allocated).join('、')+(cut?'。有砍單；已收款項需人工確認。':''));addMail(o,cut?'配貨異動通知｜'+o.id:'配貨狀態更新｜'+o.id);}persist();closeModal();renderAll();toast('配貨已更新。砍單需要人工確認，通知未真正寄出。');}
function downloadFile(filename,text,mime='text/plain;charset=utf-8'){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csvCell(value){let s=String(value??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
function exportCsv(){const rows=[['訂單編號','下單順位','下單時間(台灣)','會員編號','LINE暱稱','Email','手機','商品代碼','商品名稱','原訂數量','配貨數量','單價','原訂總額','目前總額','應付訂金/預付款','已確認淨收款','未付款','取貨方式','超商','收件人','收件電話','縣市','門市','門市代碼','訂單狀態','付款狀態','交付狀態','寄件單號','備註']];for(const o of state.orders){const t=orderTotals(o);for(const i of o.items)rows.push([o.id,o.sequence,stamp(o.createdAt),o.memberId,o.contact.nickname,o.contact.email,o.contact.phone,i.code,i.name,i.qty,i.allocated??'未配貨',i.price,o.originalTotal,t.total,t.required,t.paid,t.balance,o.delivery.method==='pickup'?'自取':'店到店',o.delivery.carrier,o.delivery.receiver,o.delivery.phone,o.delivery.county,o.delivery.storeName,o.delivery.storeCode,orderLabel(o)[0],paymentLabel(o)[0],deliveryLabel(o)[0],o.delivery.tracking,o.note]);}downloadFile('cardscave_preorders_demo.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('已匯出示範 CSV；每列一個訂單品項，訂單金額欄不可重複加總。');}
function exportMail(orderId,mailId){const o=getOrder(orderId),m=o?.mails.find(x=>x.id===mailId);if(!m)return;const lines=['卡之洞｜Email 預覽（未寄出）',m.subject,'建立時間：'+stamp(m.at),'收件人：'+m.to,'訂單編號：'+m.orderId,'','訂單：'+m.orderState,'付款：'+m.paymentState,'交付：'+m.deliveryState,'',...m.items.map(i=>`${i.code} ${i.name}｜${money(i.price)}／${i.unit}｜原訂 ${i.qty}｜配貨 ${i.allocated===null?'未確認':i.allocated}`),'','原訂總額：'+money(m.originalTotal),'目前商品小計：'+money(m.totals.subtotal),'運費：'+money(m.totals.shipping),'目前應付：'+money(m.totals.total),'應付訂金／預付款：'+money(m.totals.required),'已確認淨收款：'+money(m.totals.paid),'尚未付款：'+money(m.totals.balance),'已登錄退款：'+money(m.totals.refunded),'','LINE 暱稱：'+m.contact.nickname,'Email：'+m.contact.email,'聯絡手機：'+m.contact.phone,'取貨方式：'+(m.delivery.method==='pickup'?'門市自取':m.delivery.carrier),...(m.delivery.method==='shipping'?['收件人：'+m.delivery.receiver,'收件手機：'+m.delivery.phone,'收件門市：'+m.delivery.county+' '+m.delivery.storeName+' '+m.delivery.storeCode]:[]),'付款期限：'+stamp(m.paymentDueAt),'保留期限：'+stamp(m.delivery.deadline),'寄件單號：'+(m.delivery.tracking||'無'),'備註：'+(m.note||'無'),'','付款回報：',...m.payments.map(p=>`${p.method==='cash'?'門市收款':'匯款'} ${money(p.amount)}｜${stamp(p.paidAt)}｜${p.status}｜末五碼 ${p.last5||'未提供'}｜${p.note||''}`),'','這是通知產生當下的快照；不代表保證供貨或實際寄信。','規則版本：'+m.ruleVersion];downloadFile(m.orderId+'_email_preview.txt',lines.join('\n'));}
function changeQuantity(productId,value){const p=state.products.find(p=>p.id===productId);if(!p)return;let n=Number(value);if(!finiteInt(n,0,99)){n=Math.min(99,Math.max(0,Math.floor(n)||0));toast('數量僅接受 0–99 的整數；已修正輸入。','error');}const changed=state.draft.quantities[productId]!==n;state.draft.quantities[productId]=n;if(changed){state.draft.agree=false;persist();}const input=$(`[data-quantity="${productId}"]`);if(input)input.value=n;const card=$(`[data-product-card="${productId}"]`);card?.classList.toggle('selected',n>0);const total=$(`[data-line-total="${productId}"]`);if(total)total.textContent=n>0?money(n*p.price):'尚未選購';if(changed)renderCheckoutFooter();}
function settingsSubmit(form){if(!form.reportValidity())return;const fd=new FormData(form),integerKeys=['shipping','threshold','rate','depositDays','holdDays'];const next={...state.config};for(const k of integerKeys){if(!finiteInt(fd.get(k),0))return toast('設定必須使用非負整數。','error');next[k]=Number(fd.get(k));}if(next.rate<1||next.rate>100||next.depositDays<1||next.holdDays<1)return toast('請檢查比例與天數。','error');for(const k of ['title','closeDate','releaseDate','status','bankName','bankCode','bankAccount','bankNote'])next[k]=String(fd.get(k)||'').trim();if(!next.title)return toast('請填寫活動名稱。','error');next.demoOverride=fd.has('demoOverride');next.includeShipping=fd.get('includeShipping')==='true';next.ruleVersion='M6a-demo-'+Date.now().toString(36);for(const p of state.products){const v=fd.get('price-'+p.id);if(!finiteInt(v,1,999999))return toast('商品單價必須是正整數。','error');}for(const p of state.products)p.price=Number(fd.get('price-'+p.id));state.settingsLog.push({at:now(),actor:'示範管理員',text:'更新活動設定；舊單規則與單價不變。',before:state.config,after:next});state.config=next;state.draft.agree=false;persist();renderAll();toast('新設定已儲存，只影響新的訂單；原有訂單不變。');}
function modalSubmit(form){const kind=form.dataset.kind,o=getOrder(form.dataset.order);if(!form.reportValidity())return;const fd=new FormData(form),val=k=>String(fd.get(k)||'').trim();
 if(kind==='member-policy'){const m=member(form.dataset.member);if(!m)return;const policy=val('policy'),reason=val('reason');if(!Object.keys(policies).includes(policy)||!reason)return modalError('請填寫處理原因。');state.settingsLog.push({at:now(),actor:'示範管理員',text:`${m.id} 資格：${policies[m.policy]} → ${policies[policy]}；原因：${reason}`});m.policy=policy;state.draft.agree=false;persist();closeModal();renderAll();toast('資格已更新，只影響此會員的新訂單。');return;}

async function readProof(input){const file=input.files[0];ui.paymentProof=null;const status=$('#proofStatus');if(!file){if(status)status.textContent='';return;}if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>1.5*1024*1024){input.value='';if(status)status.textContent='檔案無效：請使用 1.5 MB 內的 PNG、JPG 或 WebP。';return toast('匯款截圖格式或大小不符合限制。','error');}if(status)status.textContent='正在讀取示範截圖…';try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});if(!/^data:image\/(png|jpeg|webp);base64,/i.test(data))throw Error('format');if(!$('#proofFile')||!$('#modal').open)return;ui.paymentProof={name:file.name,data};if(status)status.textContent='已載入：'+file.name+'（只保存在此瀏覽器）';}catch(e){input.value='';if(status)status.textContent='截圖讀取失敗，請重新選擇。';}}

 case 'edit-contact':{if(!o)return;const d=o.delivery;return showForm('編輯訂單聯絡／配送資料',`<div class="hint-box">只修改此訂單，保留異動紀錄，不會回寫會員基本資料。原型不提供直接切換取貨方式，以免運費與款項靜默改變。</div><div class="spacer-16"></div><div class="form-grid">${inputField('電子郵件','email',o.contact.email,'email','required maxlength="120"')}${inputField('LINE 暱稱','nickname',o.contact.nickname,'text','required maxlength="60"')}${inputField('聯絡手機','phone',o.contact.phone,'tel','required maxlength="16"')}${d.method==='shipping'?`${inputField('收件人','receiver',d.receiver,'text','required maxlength="40"')}${inputField('收件人手機','receiverPhone',d.phone,'tel','required maxlength="16"')}<label class="field"><span>超商</span><select name="carrier">${['7-ELEVEN','全家'].map(v=>opt(v,v,d.carrier)).join('')}</select></label><label class="field"><span>縣市</span><select name="county">${counties.map(v=>opt(v,v,d.county)).join('')}</select></label>${inputField('門市名稱','storeName',d.storeName,'text','required maxlength="60"')}${inputField('門市代碼（選填）','storeCode',d.storeCode,'text','maxlength="16"')}`:''}</div><div class="spacer-16"></div>${textField('修改原因','reason')}`,'edit-contact',oid);}
 case 'member-policy':{const m=member(el.dataset.member);if(!m)return;return showForm('調整會員預購資格',`<p class="hint">${esc(m.name)} · ${esc(m.id)}。只影響新訂單，舊單沿用下單時資格。</p><div class="spacer-16"></div><label class="field"><span>預購資格</span><select name="policy">${Object.entries(policies).map(([k,v])=>opt(k,v,m.policy)).join('')}</select></label><div class="spacer-16"></div>${textField('調整原因','reason')}`,'member-policy','',`data-member="${m.id}"`);}
 case 'preview-allocation':return previewAllocation();case 'apply-allocation':return applyAllocation();case 'export-csv':return exportCsv();case 'export-json':return downloadFile('cardscave_preorder_demo_backup.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');
 case 'reset-demo':if(!confirm('重設後會刪除這個瀏覽器內的試填訂單、截圖與設定，還原虛構範例。確定繼續？'))return;state=seedState();state.orders.forEach(o=>addMail(o,'訂單確認｜'+o.id));Object.assign(ui,{step:1,customerTab:'shop',customerOrder:null,adminTab:'orders',selectedOrder:'CC-M6A-0001',filter:'all',search:'',lastCreated:null});closeModal();persist();renderAll();return toast('已還原示範資料。');
 }
}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view-button]');if(v)return setView(v.dataset.viewButton);const a=e.target.closest('[data-action]');if(a){if(a.disabled)return;e.preventDefault();try{action(a.dataset.action,a);}catch(error){console.error(error);toast('操作未完成，請檢查輸入或重設示範資料。','error');}return;}const row=e.target.closest('tr[data-order]');if(row){ui.selectedOrder=row.dataset.order;renderAdmin();}});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-quantity]')){if(el.value==='')return;changeQuantity(el.dataset.quantity,el.value);return;}if(el.matches('[data-draft]')&&!['radio','checkbox'].includes(el.type)&&el.tagName!=='SELECT'){state.draft[el.dataset.draft]=el.value;state.draft.agree=false;persist();return;}if(el.id==='orderSearch'){ui.search=el.value;const pos=el.selectionStart;renderAdmin();const search=$('#orderSearch');search.focus();if(search.type!=='search')search.setSelectionRange(pos,pos);} });
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-quantity]')){changeQuantity(el.dataset.quantity,el.value||0);return;}if(el.id==='proofFile'){readProof(el);return;}if(el.id==='orderFilter'){ui.filter=el.value;renderAdmin();return;}if(el.matches('[data-draft]')){const key=el.dataset.draft;state.draft[key]=el.type==='checkbox'?el.checked:el.value;if(!['agree','emailConfirm'].includes(key))state.draft.agree=false;persist();if(key==='fulfillment'){renderCustomer();}}});
document.addEventListener('submit',e=>{e.preventDefault();try{if(e.target.id==='settingsForm')settingsSubmit(e.target);else if(e.target.id==='modalForm')modalSubmit(e.target);else if(e.target.id==='contactForm')nextStep();}catch(error){console.error(error);modalError('未能完成操作，請檢查輸入。');}});
$('#modal').addEventListener('click',e=>{const r=$('#modal').getBoundingClientRect();if(e.target===$('#modal')&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))closeModal();});
$('#modal').addEventListener('close',()=>{ui.paymentProof=null;ui.allocationPreview=null;});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const fresh=JSON.parse(e.newValue);if(fresh.version===VERSION){state=fresh;renderAll();toast('另一個同來源分頁的示範資料已同步。');}}catch(error){console.warn('Invalid local demo state ignored.');}}});
// Dedicated store reconciliation workspace. Existing order/payment records stay compatible.
const reviewUI={query:'',status:'pending',selected:new Set(),confirmation:null};
const reviewKey=(o,p)=>JSON.stringify([o.id,p.id]);
function reviewRows(){return state.orders.flatMap(o=>o.payments.filter(p=>p.method==='transfer').map(p=>({o,p,key:reviewKey(o,p)})));}
function visibleReviewRows(){const q=reviewUI.query.trim().toLowerCase();return reviewRows().filter(({o,p})=>(reviewUI.status==='all'||p.status===reviewUI.status)&&(!q||[o.id,o.contact.nickname,o.contact.email,o.contact.phone,p.last5].join(' ').toLowerCase().includes(q))).sort((a,b)=>new Date(a.p.reportedAt)-new Date(b.p.reportedAt));}
function reviewEligible({o,p}){return p.status==='pending'&&o.status!=='cancelled';}
function openReview(){reviewUI.selected.clear();reviewUI.confirmation=null;reviewUI.query='';reviewUI.status='pending';renderReview();$('#reviewDialog').showModal();}
function renderReview(){
 const rows=visibleReviewRows(),all=reviewRows(),pending=all.filter(r=>r.p.status==='pending');
 const selectable=rows.filter(reviewEligible);for(const key of reviewUI.selected)if(!selectable.some(r=>r.key===key))reviewUI.selected.delete(key);
 $('#reviewBody').innerHTML=`<p class="hint">集中核對所有會員的匯款回報。請先比對銀行入帳紀錄，再確認入帳。</p><div class="review-summary"><b>待核對 ${pending.length} 筆</b><strong class="mono">${money(pending.reduce((sum,r)=>sum+r.p.amount,0))}</strong><span class="muted small">通知僅產生預覽，未寄信</span></div><div class="admin-controls"><input id="reviewSearch" class="search-input" type="search" aria-label="搜尋匯款" placeholder="訂單、會員、手機或末五碼" value="${esc(reviewUI.query)}"><select id="reviewFilter" aria-label="匯款狀態">${[['pending','待核對'],['approved','已入帳'],['rejected','已退回'],['all','全部回報']].map(([v,l])=>opt(v,l,reviewUI.status)).join('')}</select></div><div class="row between wrap review-tools"><label class="check"><input id="reviewSelectAll" type="checkbox" ${selectable.length&&selectable.every(r=>reviewUI.selected.has(r.key))?'checked':''} ${!selectable.length?'disabled':''}><span>全選目前結果</span></label><span class="small muted">篩選或搜尋時會清除勾選</span></div><div id="reviewRows">${rows.map(({o,p,key})=>`<article class="order-card review-card"><div class="row between wrap"><label class="check"><input type="checkbox" data-review-key="${esc(key)}" aria-label="選取 ${esc(o.id)} ${esc(p.id)}" ${reviewUI.selected.has(key)?'checked':''} ${!reviewEligible({o,p})?'disabled':''}><span><b class="mono">${esc(o.id)}</b><small>${esc(o.contact.nickname)} · ${esc(o.contact.phone)}</small></span></label>${badge(({pending:'待核對',approved:'已入帳',rejected:'已退回'})[p.status],p.status==='pending'?'amber':p.status==='approved'?'green':'red')}</div><div class="review-money"><strong class="mono">${money(p.amount)}</strong><span>末五碼 <b class="mono">${esc(p.last5||'未提供')}</b></span></div><p class="hint">匯款 ${stamp(p.paidAt)}<br>回報 ${stamp(p.reportedAt)} · 訂單尚欠 ${money(orderTotals(o).balance)}</p>${o.status==='cancelled'?'<p class="hint-box red">訂單已取消，請另行處理款項；不可一般核款。</p>':''}${p.note?`<p class="small">備註：${esc(p.note)}</p>`:''}${p.rejectReason?`<p class="hint-box red">退回原因：${esc(p.rejectReason)}</p>`:''}${p.proofData&&/^data:image\/(png|jpeg|webp);base64,/i.test(p.proofData)?`<details class="review-proof"><summary>查看匯款憑證 · ${esc(p.proofName)}</summary><img src="${esc(p.proofData)}" alt="${esc(o.id)} 匯款憑證"></details>`:'<p class="hint">未附匯款憑證</p>'}${p.status==='pending'?`<div class="action-grid">${btn('確認這筆入帳','review-one',`data-key="${esc(key)}" ${o.status==='cancelled'?'disabled':''}`,'sm primary')}${btn('退回補件','review-reject',`data-key="${esc(key)}"`,'sm')}</div>`:`<p class="hint">處理時間 ${stamp(p.reviewedAt)}</p>`}</article>`).join('')||'<div class="empty">沒有符合條件的匯款回報。</div>'}</div><div id="reviewAction" aria-live="polite"></div><div class="review-footer"><span id="reviewSelection"></span>${btn('核對勾選款項','review-confirm','','primary')}${btn('關閉','review-close','','ghost')}</div>`;
 updateReviewSelection();
}
function updateReviewSelection(){const rows=reviewRows().filter(r=>reviewUI.selected.has(r.key));$('#reviewSelection').textContent=`已選 ${rows.length} 筆 · ${money(rows.reduce((s,r)=>s+r.p.amount,0))}`;$('#reviewBody [data-action="review-confirm"]').disabled=!rows.length;const eligible=visibleReviewRows().filter(reviewEligible),selected=eligible.filter(r=>reviewUI.selected.has(r.key)).length;$('#reviewSelectAll').checked=eligible.length>0&&selected===eligible.length;$('#reviewSelectAll').indeterminate=selected>0&&selected<eligible.length;reviewUI.confirmation=null;$('#reviewAction').innerHTML='';}
function prepareReview(kind,key){
 const rows=reviewRows().filter(r=>kind==='reject'?r.key===key:reviewUI.selected.has(r.key));
 if(!rows.length||rows.some(r=>r.p.status!=='pending'||(kind==='approve'&&!reviewEligible(r))))return toast('款項狀態已變更，請重新選取。','error');
 reviewUI.confirmation={kind,rows:rows.map(r=>({key:r.key,snapshot:JSON.stringify(r.o)}))};
 $('#reviewAction').innerHTML=`<form id="reviewForm" class="hint-box ${kind==='approve'?'purple':'amber'}"><h3>${kind==='approve'?'確認入帳':'退回補件'} · ${rows.length} 筆 · ${money(rows.reduce((s,r)=>s+r.p.amount,0))}</h3><ul>${rows.map(({o,p})=>`<li>${esc(o.id)} · ${esc(o.contact.nickname)} · ${money(p.amount)} · 末五碼 ${esc(p.last5||'未提供')}</li>`).join('')}</ul>${kind==='approve'?'<label class="check"><input name="verified" type="checkbox" required><span>我已逐筆比對銀行入帳紀錄，確認金額、時間與匯款資料相符。</span></label>':textField('退回原因','reason')}<p id="reviewError" role="alert"></p><div class="action-grid"><button class="btn primary" type="submit">${kind==='approve'?'確認全部入帳':'確認退回'}</button>${btn('取消','review-cancel','','ghost')}</div></form>`;$('#reviewAction').scrollIntoView({block:'nearest'});
}
function submitReview(form){
 if(!form.reportValidity())return;
 const confirmation=reviewUI.confirmation;if(!confirmation)return;
 const rows=confirmation.rows.map(ref=>{const row=reviewRows().find(r=>r.key===ref.key);return row&&JSON.stringify(row.o)===ref.snapshot?row:null;});
 if(rows.some(r=>!r||r.p.status!=='pending'||(confirmation.kind==='approve'&&!reviewEligible(r)))){reviewUI.confirmation=null;renderReview();return toast('訂單或款項已變更，尚未入帳；請重新核對。','error');}
 const fd=new FormData(form),reason=String(fd.get('reason')||'').trim();
 if(confirmation.kind==='approve'&&!fd.has('verified'))return;
 if(confirmation.kind==='reject'&&!reason){$('#reviewError').textContent='請填寫退回原因。';return;}
 for(const {o,p} of rows){p.status=confirmation.kind==='approve'?'approved':'rejected';p.reviewedAt=now();p.reviewedBy='示範管理員';if(p.status==='approved'){if(orderTotals(o).overpaid>0||(o.allocationAt&&new Date(p.reportedAt)<=new Date(o.allocationAt)&&o.items.some(i=>i.allocated!==null&&i.allocated<i.qty)))o.refundReview=true;addEvent(o,'集中對帳：確認匯款 '+money(p.amount)+' 已入帳（示範核對）。');addMail(o,'付款確認｜'+o.id);}else{p.rejectReason=reason;addEvent(o,'匯款回報退回補件：'+reason);addMail(o,'匯款資料待補正｜'+o.id);}}
 reviewUI.selected.clear();reviewUI.confirmation=null;persist();renderAll();renderReview();toast(`已${confirmation.kind==='approve'?'確認入帳':'退回'} ${rows.length} 筆匯款，通知已產生預覽。`);
}
document.addEventListener('change',e=>{const el=e.target;if(el.id==='reviewFilter'){reviewUI.status=el.value;reviewUI.selected.clear();renderReview();}else if(el.id==='reviewSelectAll'){reviewUI.selected=new Set(el.checked?visibleReviewRows().filter(reviewEligible).map(r=>r.key):[]);renderReview();}else if(el.matches('[data-review-key]')){if(el.checked)reviewUI.selected.add(el.dataset.reviewKey);else reviewUI.selected.delete(el.dataset.reviewKey);updateReviewSelection();}});
document.addEventListener('input',e=>{if(e.target.id==='reviewSearch'){reviewUI.query=e.target.value;reviewUI.selected.clear();renderReview();$('#reviewSearch').focus();}});
document.addEventListener('submit',e=>{if(e.target.id==='reviewForm'){e.preventDefault();submitReview(e.target);}});
$('#reviewDialog').addEventListener('close',()=>{reviewUI.selected.clear();reviewUI.confirmation=null;});
window.addEventListener('storage',e=>{if(e.key===KEY&&$('#reviewDialog').open){reviewUI.selected.clear();reviewUI.confirmation=null;renderReview();toast('資料已同步，請重新勾選要核對的款項。');}});

// Exposed only to support transparent, reproducible prototype tests; NEVER reuse as production APIs.
window.CardscaveDemo={calcDue,orderTotals,computeAllocation,csvCell,getState:()=>structuredCopy(state),version:VERSION};
renderAll();persist();if(corruptState)toast('舊版示範格式無法沿用，已改載入預設範例。','error');
</script></body></html>
